[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "@astrojs/netlify"

# Default headers for every page. Cache headers for static assets are
# handled by Astro/Netlify automatically; this section is for global
# security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"