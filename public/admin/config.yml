local_backend: true
backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Keep under 20 characters so the title fits on one line on event cards. Longer titles will be truncated with an ellipsis." }
      - { label: "Show on Front Page", name: "featured", widget: "boolean", default: false }
      - { label: "Start Date/Time", name: "startDate", widget: "datetime" }
      - { label: "End Time (same-day)", name: "endTime", widget: "string", required: false, hint: "Use for same-day end time. If event ends on a different day, use End Date/Time instead." }
      - { label: "End Date/Time (multi-day)", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 4194304
        hint: "Recommended: 1500–2500px wide, under 2MB. Max 4MB — larger files will be rejected at upload."
      - { label: "Event Link", name: "eventUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "subevents"
    label: "Sub Events"
    folder: "src/content/subevents"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Parent Event"
        name: "parentEvent"
        widget: "relation"
        collection: "events"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
      - { label: "Category", name: "category", widget: "select", options: ["liveShowcases", "gamesAndActivities", "contests", "popUps", "collaborations", "other"], default: "other" }
      - { label: "Title", name: "title", widget: "string", hint: "Keep under 20 characters so the title fits on one line on event cards. Longer titles will be truncated with an ellipsis." }
      - { label: "Start Date/Time", name: "startDate", widget: "datetime" }
      - { label: "End Time (same-day)", name: "endTime", widget: "string", required: false, hint: "Use for same-day end time. If event ends on a different day, use End Date/Time instead." }
      - { label: "End Date/Time (multi-day)", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Image"
        name: "image"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 4194304
        hint: "Recommended: 1500–2500px wide, under 2MB. Max 4MB — larger files will be rejected at upload."
      - { label: "Link", name: "eventUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "team"
    label: "Team"
    folder: "src/content/team"
    create: true
    slug: "{{name | slug}}"
    extension: "yaml"
    format: "yaml"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - label: "Image"
        name: "image"
        widget: "image"
        media_library:
          config:
            max_file_size: 1048576
        hint: "Portrait, 3:4 ratio, min 300x400px. Recommended: 600–1000px, under 500KB. Max 1MB — larger files will be rejected at upload."
      - { label: "Display Order", name: "displayOrder", widget: "number", value_type: "int", min: 0 }
      - { label: "Website", name: "website", widget: "string", required: false }

  - name: "vendors"
    label: "Vendors"
    folder: "src/content/vendors"
    create: true
    slug: "{{name | slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Website", name: "websiteUrl", widget: "string", required: false }
      - { label: "Instagram", name: "instagramUrl", widget: "string", required: false }
      - { label: "Twitter / X", name: "twitterUrl", widget: "string", required: false }
      - { label: "Bluesky", name: "bskyUrl", widget: "string", required: false }
      - label: "Logo / Image"
        name: "image"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 512000
        hint: "Square, min 400x400px. Small images load fastest. Max 500KB — larger files will be rejected at upload."
      - label: "Events Attending"
        name: "events"
        widget: "relation"
        collection: "events"
        search_fields: [ "title" ]
        value_field: "{{slug}}"
        display_fields: [ "title" ]
        multiple: true
        required: false
        hint: "Select which events this vendor is attending. Vendors with no events selected won't appear on the public Vendors page until at least one event is assigned."

  - name: "neighbors"
    label: "Partners (DTB Neighbors)"
    folder: "src/content/neighbors"
    create: true
    slug: "{{name | slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string", required: false, hint: "One-liner shown under the name on the Partners page." }
      - { label: "Link URL", name: "url", widget: "string", required: false, hint: "The page this card links to when clicked, e.g. https://example.com or an Instagram profile." }
      - label: "Logo / Image"
        name: "image"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 512000
        hint: "Square logo recommended, min 240x240px. Max 500KB. If left blank, the partner name will display as a text placeholder."
      - { label: "Display Order", name: "displayOrder", widget: "number", value_type: "int", default: 0, hint: "Lower numbers appear first. Use 0, 1, 2... to control order." }
      - { label: "Description", name: "body", widget: "markdown", required: false, hint: "Optional extended description shown on the Partners page." }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "markdown" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1 }

  - name: "sponsor"
    label: "Sponsor"
    folder: "src/content/sponsor"
    create: false
    slug: "sponsor"
    fields:
      - { label: "Stripe URL", name: "stripeUrl", widget: "string" }
      - label: "Poster Image"
        name: "poster"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 4194304
        hint: "Recommended: 1500–2500px wide, under 2MB. Max 4MB — larger files will be rejected at upload."
      - { label: "Intro / Description", name: "description", widget: "text", required: false, hint: "Short paragraph shown above the Stripe button on the Support page." }

  - name: "donate"
    label: "Donate"
    folder: "src/content/donate"
    create: false
    slug: "donate"
    fields:
      - { label: "Ko-fi URL", name: "kofiUrl", widget: "string", hint: "The full Ko-fi page URL, e.g. https://ko-fi.com/drawtheblock" }
      - { label: "Intro / Description", name: "description", widget: "text", required: false, hint: "Short paragraph shown above the Ko-fi widget on the Support page." }

  - name: "pageContent"
    label: "Page Content"
    files:
      - file: "src/content/pageContent/background.json"
        label: "Site Background"
        name: "background"
        fields:
          - label: "Background Mode"
            name: "backgroundMode"
            widget: "select"
            options:
              - { label: "Solid Color", value: "color" }
              - { label: "Image", value: "image" }
            default: "color"
            hint: "Choose 'Solid Color' to use a flat color, or 'Image' to upload a background photo. Switching modes preserves both values so you can switch back without re-entering."
          - label: "Background Color"
            name: "backgroundColor"
            widget: "color"
            default: "#287feb"
            hint: "Used when Background Mode is set to 'Solid Color'."
          - label: "Background Image"
            name: "backgroundImage"
            widget: "image"
            required: false
            media_library:
              config:
                max_file_size: 6291456
            hint: "Used when Background Mode is set to 'Image'. Recommended: 2000–3000px wide, 2–3MB. Max 6MB. The image covers the full screen behind the content column — visible only on wider screens."

      - file: "src/content/pageContent/logo-backdrop.json"
        label: "Logo Backdrop"
        name: "logoBackdrop"
        fields:
          - label: "Backdrop Mode"
            name: "backdropMode"
            widget: "select"
            options:
              - { label: "None", value: "none" }
              - { label: "Image", value: "image" }
            default: "none"
            hint: "Choose 'None' for no backdrop, or 'Image' to upload a photo behind the logo."
          - label: "Backdrop Image"
            name: "backdropImage"
            widget: "image"
            required: false
            media_library:
              config:
                max_file_size: 6291456
            hint: "Used when Backdrop Mode is set to 'Image'. The image appears behind the logo across the full page width. Recommended: 2000–3000px wide, under 2MB. Max 6MB."

      - file: "src/content/pageContent/tagline.json"
        label: "Tagline"
        name: "tagline"
        fields:
          - label: "Tagline Image"
            name: "taglineImage"
            widget: "image"
            required: false
            media_library:
              config:
                max_file_size: 2097152
            hint: "Recommended: 1500–2000px wide, under 1MB. Max 2MB — larger files will be rejected at upload."
          - { label: "Tagline Text (fallback)", name: "taglineText", widget: "string", required: false, hint: "..." }

      - file: "src/content/pageContent/mission.json"
        label: "Mission"
        name: "mission"
        fields:
          - { label: "Mission Paragraph", name: "mission", widget: "text", required: true, hint: "Shown at the top of the About page. Keep it evergreen — avoid hardcoded dates or specific event details." }

      - file: "src/content/pageContent/quote.json"
        label: "Quote"
        name: "quote"
        fields:
          - { label: "Quote", name: "quote", widget: "text", required: true, hint: "A short quote shown below the team grid on the About page. Don't include the dash and attribution here — use the field below for that." }
          - { label: "Attribution", name: "attribution", widget: "string", required: false, hint: "Who said it. e.g. \"Kenji\" — the dash will be added automatically when displayed." }


      - file: "src/content/peekSettings/peek-settings.json"
        label: "Peek Mascot"
        name: "peek-settings"
        fields:
          - label: "Home"
            name: "home"
            widget: "object"
            collapsed: true
            fields: &peek_page_fields
              - { label: "Show Peek Mascot", name: "peekEnabled", widget: "boolean" }
              - label: "Expression"
                name: "peekVariant"
                widget: "select"
                options:
                  - { label: "Default", value: "default" }
                  - { label: "Smile",   value: "smile"   }
                  - { label: "Anger",   value: "anger"   }
                  - { label: "Shock",   value: "shock"   }
                default: "default"
              - label: "Side"
                name: "peekSide"
                widget: "select"
                options:
                  - { label: "Left",  value: "left"  }
                  - { label: "Right", value: "right" }
                default: "left"
              - { label: "Vertical Position", name: "peekBottom", widget: "string", default: "80px", hint: "Distance from the bottom of the content column. CSS units, e.g. 80px or 200px." }
          - label: "About"
            name: "about"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Events Home"
            name: "eventsHome"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Event Detail"
            name: "eventsDetail"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Sub-event Detail"
            name: "eventsSubevent"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Events Archive"
            name: "eventsArchive"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Vendors"
            name: "vendors"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Shop"
            name: "shop"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "FAQ"
            name: "faq"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Support"
            name: "support"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Newsletter"
            name: "newsletter"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields
          - label: "Partners"
            name: "partners"
            widget: "object"
            collapsed: true
            fields: *peek_page_fields

  - name: "settings"
    label: "Settings"
    files:
      - label: "Social Links"
        name: "social"
        file: "src/content/settings/social.json"
        fields:
          - { label: "Discord URL", name: "discordUrl", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
      - label: "Vendor Applications"
        name: "vendors"
        file: "src/content/vendorSettings/vendors.json"
        fields:
          - { label: "Application URL", name: "vendorApplicationUrl", widget: "string", required: false }
          - { label: "Application Info", name: "vendorAppInfo", widget: "text", required: false }
      - label: "Marquee (Scrolling Banner)"
        name: "marquee"
        file: "src/content/marqueeSettings/marquee.json"
        description: "The scrolling ticker that appears under the site navigation. Edit 'Global' for a site-wide banner. Use the per-page sections to override the banner on a single page."
        fields:
          - label: "Global (shown on all pages by default)"
            name: "global"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true, hint: "Turn off to hide the marquee site-wide (unless a page has its own override)." }
              - { label: "Messages", name: "messages", widget: "list", field: { label: "Message", name: "message", widget: "string" }, hint: "Each line becomes one scrolling message. Keep them short and punchy." }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "Home — Override"
            name: "home"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the Home page. Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "About — Override"
            name: "about"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the About page. Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "Events — Override"
            name: "events"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the Events page. Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "Vendors — Override"
            name: "vendors"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the Vendors page. Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "Support — Override"
            name: "support"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the Support page (donate + sponsor). Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "Partners — Override"
            name: "partners"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the Partners page. Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."
          - label: "FAQ — Override"
            name: "faq"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to override the Global marquee on the FAQ page. Enable with empty messages to hide the marquee on this page." }
              - { label: "Messages", name: "messages", widget: "list", required: false, field: { label: "Message", name: "message", widget: "string" } }
              - label: "Scroll Speed (seconds per loop)"
                name: "speed"
                widget: "string"
                required: false
                pattern: [ '^[1-9][0-9]*$', 'Whole numbers only (1 or higher)' ]
                hint: "Optional. Higher number = slower scroll. Leave blank for default."