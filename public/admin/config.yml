local_backend: true
backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Show on Front Page", name: "featured", widget: "boolean", default: false }
      - { label: "Start Date/Time", name: "startDate", widget: "datetime" }
      - { label: "End Time (same-day)", name: "endTime", widget: "string", required: false, hint: "Use for same-day end time. If event ends on a different day, use End Date/Time instead." }
      - { label: "End Date/Time (multi-day)", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Event Link", name: "eventUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "subevents"
    label: "Sub Events"
    folder: "src/content/subevents"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Parent Event"
        name: "parentEvent"
        widget: "relation"
        collection: "events"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
      - { label: "Category", name: "category", widget: "select", options: ["liveShowcases", "gamesAndActivities", "contests", "other"], default: "other" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Start Date/Time", name: "startDate", widget: "datetime" }
      - { label: "End Time (same-day)", name: "endTime", widget: "string", required: false, hint: "Use for same-day end time. If event ends on a different day, use End Date/Time instead." }
      - { label: "End Date/Time (multi-day)", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Link", name: "eventUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "team"
    label: "Team"
    folder: "src/content/team"
    create: true
    slug: "{{name | slug}}"
    extension: "yaml"
    format: "yaml"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Display Order", name: "displayOrder", widget: "number", value_type: "int", min: 0 }
      - { label: "Website", name: "website", widget: "string", required: false }

  - name: "vendors"
    label: "Vendors"
    folder: "src/content/vendors"
    create: true
    slug: "{{name | slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Website", name: "websiteUrl", widget: "string", required: false }
      - { label: "Instagram", name: "instagramUrl", widget: "string", required: false }
      - { label: "Twitter / X", name: "twitterUrl", widget: "string", required: false }
      - { label: "Bluesky", name: "bskyUrl", widget: "string", required: false }
      - { label: "Logo/Image", name: "image", widget: "image", required: false }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "markdown" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 1 }

  - name: "sponsor"
    label: "Sponsor"
    folder: "src/content/sponsor"
    create: false
    slug: "sponsor"
    fields:
      - { label: "Stripe URL", name: "stripeUrl", widget: "string" }
      - { label: "Poster Image", name: "poster", widget: "image", required: false }

  - name: "settings"
    label: "Settings"
    files:
      - label: "Social Links"
        name: "social"
        file: "src/content/settings/social.json"
        fields:
          - { label: "Discord URL", name: "discordUrl", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
          - { label: "Vendor Application URL", name: "vendorApplicationUrl", widget: "string", required: false }
